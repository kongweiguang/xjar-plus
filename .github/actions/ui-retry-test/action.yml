# @author kongweiguang
name: UI retry regression test
description: Run the dependency-free Web UI retry behavior regression test.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        package-manager-cache: false
    - name: Run Node UI regression test
      shell: bash
      run: node --test xjar-plus-app/src/test/js/ui-retry.test.cjs
