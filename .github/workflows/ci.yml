# @author kongweiguang
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-retry:
    name: Web UI retry behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run UI retry regression test
        uses: ./.github/actions/ui-retry-test

  java-quality:
    name: Java 21 quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test Python maintenance scripts
        run: python -m unittest discover -s scripts/tests -v
      - name: Build five Maven modules and run quality checks
        run: mvn -B -ntp -Pquality verify
      - name: Check source policy
        run: python scripts/check_source.py
      - name: Check module and DDD dependency directions
        run: python scripts/check_architecture.py

  go-tests:
    name: Go 1.24 tests and vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache-dependency-path: launcher/go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check Go formatting without modifying sources
        run: python ../scripts/check_go_format.py
      - run: go test ./...
      - run: go vet ./...

  go-cross-build:
    name: Go cross-build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache-dependency-path: launcher/go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build for target OS and architecture
        env:
          OUTPUT_FILE: ${{ runner.temp }}/xjp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
        run: python ../scripts/cross_build.py --target '${{ matrix.goos }}-${{ matrix.goarch }}' --go-executable go --output "$OUTPUT_FILE"

  security-probes:
    name: Java 8/21 and Go protocol security probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Java 8 probe runtime
        id: java8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          set-default: false
      - name: Select Java 21 compiler and probe runtime
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache-dependency-path: integration-tests/security/go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run cross-language and broker security probes
        env:
          XJP_JAVA8_HOME: ${{ steps.java8.outputs.path }}
        run: python integration-tests/security/run.py --java8-home "$XJP_JAVA8_HOME"
