# @author kongweiguang
name: Compatibility

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-matrix:
    name: ${{ matrix.framework }} archive matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        framework: [ plain, boot, solon ]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Java 8 for baseline applications
        id: java8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          set-default: false
      - name: Install Java 11 plain-JAR runtime
        id: java11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          set-default: false
      - name: Install Java 17 for Boot modern runtime
        id: java17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          set-default: false
      - name: Install Java 25 runtime matrix
        id: java25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          set-default: false
      - name: Select Java 21 for the build tool
        id: java21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run locked framework compatibility cases
        env:
          XJP_JAVA8: ${{ steps.java8.outputs.path }}/bin/java
          XJP_JAVA11: ${{ steps.java11.outputs.path }}/bin/java
          XJP_JAVA17: ${{ steps.java17.outputs.path }}/bin/java
          XJP_JAVA21: ${{ steps.java21.outputs.path }}/bin/java
          XJP_JAVA25: ${{ steps.java25.outputs.path }}/bin/java
        run: python scripts/verify_compatibility.py --framework '${{ matrix.framework }}' --java8 "$XJP_JAVA8" --java11 "$XJP_JAVA11" --java17 "$XJP_JAVA17" --java21 "$XJP_JAVA21" --java25 "$XJP_JAVA25" --maven-command mvn
